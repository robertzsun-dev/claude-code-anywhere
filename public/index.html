<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code Remote Access</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Claude Remote">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <!-- Theme Color -->
    <meta name="theme-color" content="#f97316">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
            background: #000000;
            color: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0 1.5rem;
            height: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        #header h1 {
            font-size: 0.875rem;
            font-weight: 600;
            color: #fafafa;
            letter-spacing: -0.01em;
        }

        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #session-info {
            font-size: 0.8125rem;
            color: #a1a1aa;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }

        #notification-toggle {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fafafa;
            font-size: 1.25rem;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #notification-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        #notification-toggle:active {
            transform: scale(0.95);
        }

        #notification-toggle.enabled {
            background: rgba(249, 115, 22, 0.15);
            border-color: rgba(249, 115, 22, 0.3);
            color: #fb923c;
        }

        #main {
            flex: 1;
            display: flex;
            overflow: visible;
        }

        #sidebar {
            width: 280px;
            background: #000000;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: margin-left 0.2s cubic-bezier(0.16, 1, 0.3, 1), width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #sidebar.hidden {
            margin-left: -280px;
            width: 0;
            border-right: none;
        }

        #sidebar h2 {
            padding: 1rem 1.25rem;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #71717a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: #000000;
        }

        .session-item {
            padding: 0.875rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: background 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            background: transparent;
        }

        .session-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #fafafa;
            opacity: 0;
            transition: opacity 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .session-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .session-item.active {
            background: rgba(255, 255, 255, 0.06);
        }

        .session-item.active::before {
            opacity: 1;
        }

        .session-id {
            font-family: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Menlo', monospace;
            font-size: 0.8125rem;
            color: #fafafa;
            margin-bottom: 0.375rem;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .session-meta {
            font-size: 0.75rem;
            color: #71717a;
            line-height: 1.5;
        }

        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        #terminal-container {
            flex: 1;
            padding: 1rem;
            background: #000000;
            display: none;
            overflow: auto;
            position: relative;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y;
            min-width: 0;
        }

        #terminal {
            /* Let xterm.js control dimensions based on cols/rows */
        }

        #terminal .xterm-viewport {
            overflow: hidden !important;
        }

        #terminal .xterm-screen canvas {
            display: block;
        }

        #terminal-container.active {
            display: block;
        }

        button {
            padding: 0.5rem 0.875rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fafafa;
            cursor: pointer;
            font-size: 0.8125rem;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }

        button:active {
            background: rgba(255, 255, 255, 0.04);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #status-bar {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fafafa;
            padding: 0 1.5rem;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            font-weight: 400;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        .status-dot.disconnected {
            background: #71717a;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        #no-session {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100%;
            color: #71717a;
        }

        #no-session h2 {
            margin-bottom: 0.5rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #fafafa;
            letter-spacing: -0.01em;
        }

        #no-session p {
            color: #71717a;
            font-size: 0.8125rem;
        }

        .hidden {
            display: none !important;
        }

        #loading {
            text-align: center;
            padding: 2rem;
            color: #71717a;
            font-size: 0.8125rem;
        }

        #terminal {
            height: 100%;
            width: 100%;
        }

        .keyboard-hints {
            font-size: 0.6875rem;
            color: #52525b;
            padding: 0.75rem 1.25rem;
            text-align: center;
            background: #000000;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        #sidebar-toggle {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fafafa;
            padding: 0.375rem 0.625rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 6px;
            line-height: 1;
        }

        #sidebar-toggle:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            #header {
                height: 44px;
                padding: 0 0.75rem;
            }

            #header h1 {
                font-size: 0.8125rem;
            }

            #session-info {
                display: none;
            }

            .header-left {
                gap: 0.5rem;
            }

            #sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 50;
                box-shadow: 2px 0 8px rgba(0, 0, 0, 0.3);
            }

            #header {
                z-index: 100;
            }

            #sidebar.hidden {
                margin-left: -280px;
            }

            #sidebar-toggle {
                padding: 0.5rem;
                font-size: 1.125rem;
                min-width: 40px;
                min-height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #terminal-container {
                padding: 0.5rem;
            }

            #status-bar {
                height: 32px;
                padding: 0 0.75rem;
                font-size: 0.6875rem;
            }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #fafafa;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #a1a1aa;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color 0.15s;
        }

        .modal-close:hover {
            color: #fafafa;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .current-path {
            padding: 0.75rem 1rem;
            background: #09090b;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.8125rem;
            color: #a1a1aa;
            font-family: 'Monaco', 'Menlo', monospace;
            word-break: break-all;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .file-item {
            padding: 0.75rem 1rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.8125rem;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .file-item.directory {
            color: #60a5fa;
        }

        .file-item.file {
            color: #a1a1aa;
        }

        .file-icon {
            font-size: 1rem;
            width: 1.25rem;
            text-align: center;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fafafa;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        #start-session-btn {
            width: calc(100% - 2.5rem);
            margin: 1rem 1.25rem;
            padding: 0.75rem;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        #start-session-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="header-left">
            <button id="sidebar-toggle" title="Toggle Sidebar (Ctrl+B)">☰</button>
            <h1>Claude Code Remote Access</h1>
        </div>
        <div class="header-right">
            <button id="notification-toggle" title="Enable notifications" onclick="requestNotificationPermission()">
                🔔
            </button>
            <div id="session-info"></div>
        </div>
    </div>

    <div id="main">
        <div id="sidebar">
            <h2>Active Sessions</h2>
            <button id="start-session-btn">+ Start New Session</button>
            <div id="loading">Loading sessions...</div>
            <div id="session-list"></div>
        </div>

        <div id="content">
            <div id="no-session">
                <h2>No Session Selected</h2>
                <p>Select a session from the sidebar to view</p>
            </div>

            <div id="terminal-container">
                <div id="terminal"></div>
            </div>

            <div class="keyboard-hints">
                Press Ctrl+Shift+V to paste | Ctrl+B to toggle sidebar | Type directly in terminal
            </div>
        </div>
    </div>

    <div id="status-bar">
        <div>
            <span class="status-dot disconnected" id="status-dot"></span>
            <span id="status-text">Disconnected</span>
        </div>
        <div id="session-stats"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
    <script>
        let currentSession = null;
        let ws = null;
        let sessions = [];
        let term = null;
        let notificationsEnabled = false;
        let lastOutputTime = Date.now();
        let waitingForInput = false;

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {
                    console.log('Service Worker registered:', registration);
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        }

        // Request notification permission
        async function requestNotificationPermission() {
            if (!('Notification' in window)) {
                alert('This browser does not support notifications');
                return false;
            }

            if (Notification.permission === 'granted') {
                notificationsEnabled = true;
                updateNotificationButton();
                return true;
            }

            if (Notification.permission !== 'denied') {
                const permission = await Notification.requestPermission();
                notificationsEnabled = permission === 'granted';
                if (notificationsEnabled) {
                    localStorage.setItem('notificationsEnabled', 'true');
                    updateNotificationButton();
                    showNotification('Notifications enabled!', 'You will receive alerts when Claude needs your attention.');
                } else {
                    alert('Notifications were denied. You can enable them in your browser settings.');
                }
                return notificationsEnabled;
            } else {
                alert('Notifications are blocked. Please enable them in your browser settings.');
            }

            return false;
        }

        // Update notification button appearance
        function updateNotificationButton() {
            const btn = document.getElementById('notification-toggle');
            if (btn) {
                if (notificationsEnabled) {
                    btn.classList.add('enabled');
                    btn.title = 'Notifications enabled';
                } else {
                    btn.classList.remove('enabled');
                    btn.title = 'Enable notifications';
                }
            }
        }

        // Show a notification
        function showNotification(title, body) {
            if (!notificationsEnabled || Notification.permission !== 'granted') {
                return;
            }

            // Don't show if page is focused
            if (document.hasFocus()) {
                return;
            }

            const notification = new Notification(title, {
                body: body,
                icon: '/icon-192.png',
                badge: '/icon-192.png',
                vibrate: [200, 100, 200],
                tag: 'claude-waiting',
                requireInteraction: true
            });

            notification.onclick = () => {
                window.focus();
                notification.close();
            };
        }

        // Detect if Claude is waiting for input by analyzing terminal output
        function detectWaitingForInput(data) {
            const text = data.toLowerCase();

            // Common patterns that indicate Claude is waiting for user input
            const waitingPatterns = [
                'press enter',
                'continue?',
                'proceed?',
                'yes/no',
                'y/n',
                'choose an option',
                'select:',
                'your choice:',
                '? ',  // Question mark prompts
                'waiting for',
                'enter to continue',
                'press any key',
                'would you like to',
                'do you want to',
                'should i',
                'may i',
                'okay to',
                'confirm:',
                'approve:',
                '[y/n]',
                '(y/n)',
                'type your',
                'please enter',
                'input:'
            ];

            const hasWaitingPattern = waitingPatterns.some(pattern => text.includes(pattern));

            // Also detect if output has stopped for a while (potential prompt)
            const timeSinceLastOutput = Date.now() - lastOutputTime;
            const outputStalled = timeSinceLastOutput > 2000; // 2 seconds of no output

            if (hasWaitingPattern || (outputStalled && text.trim().length > 0)) {
                if (!waitingForInput) {
                    waitingForInput = true;
                    showNotification(
                        'Claude needs your attention',
                        'Claude Code is waiting for your input or response'
                    );
                }
            }
        }

        // Check notification permission on load
        if (localStorage.getItem('notificationsEnabled') === 'true') {
            if (Notification.permission === 'granted') {
                notificationsEnabled = true;
            }
        }
        // Update button state after DOM is loaded
        window.addEventListener('DOMContentLoaded', updateNotificationButton);

        // DOM elements
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sessionList = document.getElementById('session-list');
        const loading = document.getElementById('loading');
        const noSession = document.getElementById('no-session');
        const terminalContainer = document.getElementById('terminal-container');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const sessionInfo = document.getElementById('session-info');
        const sessionStats = document.getElementById('session-stats');

        // Hide sidebar by default on mobile
        if (window.innerWidth <= 768) {
            sidebar.classList.add('hidden');
        }

        // Sidebar toggle
        function toggleSidebar() {
            sidebar.classList.toggle('hidden');
            // No resize needed - terminal maintains natural PTY size
        }

        sidebarToggle.addEventListener('click', toggleSidebar);

        // Keyboard shortcut for sidebar toggle (Ctrl+B)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'b') {
                e.preventDefault();
                toggleSidebar();
            }
        });

        // Initialize xterm.js with specific dimensions from PTY
        function initTerminal(cols, rows) {
            if (term) {
                term.dispose();
            }

            // Create terminal with exact PTY dimensions
            // This ensures proper character alignment and enables horizontal scrolling
            term = new Terminal({
                cols: cols || 80,
                rows: rows || 24,
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Monaco, Courier New, monospace',
                theme: {
                    background: '#000000',
                    foreground: '#ffffff',
                    cursor: '#ffffff',
                    cursorAccent: '#000000',
                    selection: 'rgba(255, 255, 255, 0.3)',
                    black: '#000000',
                    red: '#cd3131',
                    green: '#0dbc79',
                    yellow: '#e5e510',
                    blue: '#2472c8',
                    magenta: '#bc3fbc',
                    cyan: '#11a8cd',
                    white: '#e5e5e5',
                    brightBlack: '#666666',
                    brightRed: '#f14c4c',
                    brightGreen: '#23d18b',
                    brightYellow: '#f5f543',
                    brightBlue: '#3b8eea',
                    brightMagenta: '#d670d6',
                    brightCyan: '#29b8db',
                    brightWhite: '#e5e5e5'
                },
                scrollback: 10000,
                convertEol: false,
                scrollOnUserInput: true,
                windowsMode: false,
                allowProposedApi: false
            });

            term.loadAddon(new WebLinksAddon.WebLinksAddon());
            term.open(document.getElementById('terminal'));

            // Debug: log terminal dimensions after opening
            console.log('Terminal initialized:', {
                cols: term.cols,
                rows: term.rows,
                element: term.element,
                elementWidth: term.element?.offsetWidth,
                elementScrollWidth: term.element?.scrollWidth
            });

            // Force terminal to not shrink - set min-width based on cols
            // Character width for Monaco 14px is approximately 8.4px
            // Add some padding for safety
            const charWidth = 8.4;
            const minWidth = Math.ceil((cols || 80) * charWidth);

            if (term.element) {
                term.element.style.minWidth = `${minWidth}px`;
                term.element.style.width = `${minWidth}px`;

                // Also set on viewport and screen
                const viewport = term.element.querySelector('.xterm-viewport');
                const screen = term.element.querySelector('.xterm-screen');

                if (viewport) {
                    viewport.style.width = `${minWidth}px`;
                }
                if (screen) {
                    screen.style.width = `${minWidth}px`;
                }

                console.log('Set terminal width:', {
                    minWidth,
                    elementWidth: term.element.offsetWidth,
                    elementScrollWidth: term.element.scrollWidth,
                    containerWidth: document.getElementById('terminal-container').offsetWidth
                });
            }

            // Handle terminal input
            term.onData((data) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'input',
                        data: data
                    }));
                    // Reset waiting flag when user provides input
                    waitingForInput = false;
                }
            });
        }

        // Send terminal size to server
        function sendTerminalSize() {
            if (ws && ws.readyState === WebSocket.OPEN && term) {
                ws.send(JSON.stringify({
                    type: 'resize',
                    cols: term.cols,
                    rows: term.rows
                }));
            }
        }

        // Load sessions
        async function loadSessions() {
            try {
                const response = await fetch('/sessions');
                const data = await response.json();
                sessions = data.sessions;
                renderSessions();
            } catch (error) {
                console.error('Error loading sessions:', error);
                sessionList.innerHTML = '<div style="padding: 1rem; color: #f48771;">Error loading sessions</div>';
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Render session list
        function renderSessions() {
            if (sessions.length === 0) {
                sessionList.innerHTML = '<div style="padding: 1rem; color: #858585;">No active sessions</div>';
                return;
            }

            sessionList.innerHTML = sessions.map(session => {
                const age = Math.floor((Date.now() - new Date(session.created).getTime()) / 1000);
                const ageStr = age < 60 ? `${age}s` : `${Math.floor(age / 60)}m`;

                return `
                    <div class="session-item" data-session-id="${session.id}">
                        <div class="session-id">${session.id}</div>
                        <div class="session-meta">
                            ${session.metadata.hostname || 'Unknown host'}<br>
                            ${session.metadata.cwd || '~'}<br>
                            Created ${ageStr} ago
                        </div>
                    </div>
                `;
            }).join('');

            // Add click handlers
            document.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sessionId = item.dataset.sessionId;
                    connectToSession(sessionId);
                });
            });
        }

        // Connect to session
        function connectToSession(sessionId) {
            // Close existing connection
            if (ws) {
                ws.close();
            }

            currentSession = sessionId;

            // Update UI
            document.querySelectorAll('.session-item').forEach(item => {
                item.classList.toggle('active', item.dataset.sessionId === sessionId);
            });

            noSession.classList.add('hidden');
            terminalContainer.classList.add('active');

            // Don't initialize terminal yet - wait for session-attached with PTY dimensions

            // Connect WebSocket
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}?role=viewer&session=${sessionId}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';
                updateSessionInfo();

                // Note: Not sending terminal size - PTY is locked to local terminal size
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };

            ws.onclose = () => {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected';
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                term.write('\r\n\x1b[31m[Error: Connection failed]\x1b[0m\r\n');
            };
        }

        // Handle WebSocket message
        function handleMessage(message) {
            switch (message.type) {
                case 'session-attached':
                    // Initialize terminal with PTY dimensions
                    if (message.metadata && message.metadata.cols && message.metadata.rows) {
                        initTerminal(message.metadata.cols, message.metadata.rows);
                    } else {
                        // Fallback to default dimensions if not provided
                        initTerminal(80, 24);
                    }

                    // Display history
                    if (message.history && message.history.length > 0) {
                        message.history.forEach(item => {
                            if (item.type === 'output') {
                                term.write(item.data);
                            }
                        });
                    }
                    updateSessionInfo(message.metadata);
                    break;

                case 'output':
                    if (term) {
                        term.write(message.data);
                        // Track output timing and detect if Claude is waiting for input
                        lastOutputTime = Date.now();
                        detectWaitingForInput(message.data);
                    }
                    break;

                case 'metadata':
                    // Resize terminal if dimensions changed
                    if (message.data && message.data.cols && message.data.rows && term) {
                        const currentCols = term.cols;
                        const currentRows = term.rows;
                        if (currentCols !== message.data.cols || currentRows !== message.data.rows) {
                            console.log('Resizing terminal:', {
                                from: { cols: currentCols, rows: currentRows },
                                to: { cols: message.data.cols, rows: message.data.rows }
                            });
                            term.resize(message.data.cols, message.data.rows);

                            // Update element width after resize
                            const charWidth = 8.4;
                            const minWidth = Math.ceil(message.data.cols * charWidth);

                            if (term.element) {
                                term.element.style.minWidth = `${minWidth}px`;
                                term.element.style.width = `${minWidth}px`;

                                const viewport = term.element.querySelector('.xterm-viewport');
                                const screen = term.element.querySelector('.xterm-screen');

                                if (viewport) {
                                    viewport.style.width = `${minWidth}px`;
                                }
                                if (screen) {
                                    screen.style.width = `${minWidth}px`;
                                }

                                console.log('Updated terminal width after resize:', minWidth);
                            }
                        }
                    }
                    updateSessionInfo(message.data);
                    break;

                case 'exit':
                    if (term) {
                        term.write(`\r\n\x1b[31m[Session ended with code ${message.code}]\x1b[0m\r\n`);
                    }
                    break;

                case 'wrapper-disconnected':
                    if (term) {
                        term.write('\r\n\x1b[33m[Wrapper disconnected - waiting for reconnection...]\x1b[0m\r\n');
                    }
                    break;

                case 'error':
                    if (term) {
                        term.write(`\r\n\x1b[31m[Error: ${message.error}]\x1b[0m\r\n`);
                    }
                    break;
            }
        }

        // Update session info
        function updateSessionInfo(metadata = null) {
            const session = sessions.find(s => s.id === currentSession);
            if (!session) return;

            const meta = metadata || session.metadata;

            sessionInfo.innerHTML = `
                Session: <strong>${currentSession.substring(0, 8)}...</strong> |
                ${meta.hostname || 'Unknown'} |
                ${meta.cwd || '~'}
            `;

            sessionStats.textContent = `${meta.user || 'unknown'}@${meta.hostname || 'unknown'}`;
        }

        // Terminal input is handled directly by xterm.js
        // No need for separate input box

        // File Browser functionality
        let currentPath = '';

        function openFileBrowser() {
            const modal = document.getElementById('file-browser-modal');
            modal.classList.add('show');
            browseDirectory(''); // Start at home directory
        }

        function closeFileBrowser() {
            const modal = document.getElementById('file-browser-modal');
            modal.classList.remove('show');
        }

        async function browseDirectory(path) {
            try {
                const url = `/browse?path=${encodeURIComponent(path)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                currentPath = data.currentPath;
                document.getElementById('current-path-display').textContent = currentPath;

                const fileList = document.getElementById('file-list');
                fileList.innerHTML = '';

                data.items.forEach(item => {
                    const fileItem = document.createElement('div');
                    fileItem.className = `file-item ${item.isDirectory ? 'directory' : 'file'}`;

                    const icon = document.createElement('span');
                    icon.className = 'file-icon';
                    icon.textContent = item.isDirectory ? '📁' : '📄';

                    const name = document.createElement('span');
                    name.textContent = item.name;

                    fileItem.appendChild(icon);
                    fileItem.appendChild(name);

                    if (item.isDirectory) {
                        fileItem.onclick = () => browseDirectory(item.path);
                    }

                    fileList.appendChild(fileItem);
                });
            } catch (err) {
                console.error('Error browsing directory:', err);
                alert('Error browsing directory: ' + err.message);
            }
        }

        async function selectCurrentDirectory() {
            if (!currentPath) {
                alert('No directory selected');
                return;
            }

            try {
                // Get terminal dimensions from xterm if available, otherwise calculate from viewport
                let cols = 80;
                let rows = 24;

                if (term) {
                    cols = term.cols;
                    rows = term.rows;
                } else {
                    // Create a temporary terminal to measure actual character dimensions
                    const tempTerm = new Terminal({
                        fontSize: 14,
                        fontFamily: 'Menlo, Monaco, "Courier New", monospace'
                    });

                    const tempContainer = document.createElement('div');
                    tempContainer.style.position = 'absolute';
                    tempContainer.style.visibility = 'hidden';
                    tempContainer.style.left = '-9999px';
                    document.body.appendChild(tempContainer);

                    let charWidth, charHeight;

                    try {
                        tempTerm.open(tempContainer);

                        // Write some text to ensure rendering
                        tempTerm.write('X');

                        // Wait a tick for rendering to complete
                        await new Promise(resolve => setTimeout(resolve, 10));

                        // Measure from actual DOM elements
                        const textLayer = tempContainer.querySelector('.xterm-text-layer');

                        if (textLayer && textLayer.children.length > 0) {
                            // Measure from the actual rendered character
                            const firstRow = textLayer.children[0];
                            const rowHeight = firstRow.offsetHeight || 20;
                            const charElement = firstRow.querySelector('span');
                            const charElementWidth = charElement ? charElement.offsetWidth : 8.4;

                            charHeight = rowHeight;
                            charWidth = charElementWidth;
                        } else {
                            // Fallback to reasonable defaults for 14px font
                            charWidth = 8.4;
                            charHeight = 20;
                        }
                    } catch (err) {
                        // Suppress xterm.js internal initialization errors
                        console.debug('Terminal measurement error (non-fatal):', err.message);
                        charWidth = 8.4;
                        charHeight = 20;
                    }

                    // Get available space - use full viewport for better mobile support
                    // Account for UI chrome (header, padding, margins)
                    const headerHeight = 60; // Approximate header height
                    const padding = 40; // UI padding/margins

                    const availableWidth = window.innerWidth - padding;
                    const availableHeight = window.innerHeight - headerHeight - padding;

                    cols = Math.floor(availableWidth / charWidth);
                    rows = Math.floor(availableHeight / charHeight);

                    // Clean up - wait a bit longer to avoid xterm.js cleanup errors
                    await new Promise(resolve => setTimeout(resolve, 10));
                    try {
                        tempTerm.dispose();
                        document.body.removeChild(tempContainer);
                    } catch (err) {
                        // Suppress cleanup errors
                    }

                    // Clamp to reasonable values
                    cols = Math.max(40, Math.min(cols, 300));  // Lower minimum for mobile
                    rows = Math.max(20, Math.min(rows, 100));  // Lower minimum for mobile

                    console.log('Calculated terminal dimensions for new session:', {
                        device: {
                            width: window.innerWidth,
                            height: window.innerHeight,
                            userAgent: navigator.userAgent.substr(0, 50)
                        },
                        charDimensions: { charWidth, charHeight },
                        available: { availableWidth, availableHeight },
                        terminal: { cols, rows }
                    });
                }

                const response = await fetch('/start-session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        workingDir: currentPath,
                        command: 'claude',
                        cols: cols,
                        rows: rows
                    })
                });

                const result = await response.json();

                if (result.error) {
                    alert('Error: ' + result.error);
                    return;
                }

                closeFileBrowser();

                alert(`Session created in ${result.workingDir}!\n\nTmux session: ${result.tmuxSession}\nAttach with: tmux attach -t ${result.tmuxSession}\n\nThe session will appear in the web interface shortly.`);

                // Reload sessions list immediately and then poll frequently for the new session
                loadSessions();

                // Poll more frequently for 30 seconds to catch the new session
                let pollCount = 0;
                const pollInterval = setInterval(() => {
                    loadSessions();
                    pollCount++;
                    if (pollCount >= 15) { // 15 polls * 2 seconds = 30 seconds
                        clearInterval(pollInterval);
                    }
                }, 2000);
            } catch (err) {
                console.error('Error starting session:', err);
                alert('Error starting session: ' + err.message);
            }
        }

        // Add event listener for Start New Session button
        document.getElementById('start-session-btn').addEventListener('click', openFileBrowser);

        // Auto-refresh session list
        setInterval(loadSessions, 10000); // Refresh every 10 seconds

        // Initial load
        loadSessions();
    </script>

    <!-- File Browser Modal -->
    <div id="file-browser-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Select Directory</h3>
                <button class="modal-close" onclick="closeFileBrowser()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="current-path" id="current-path-display"></div>
                <div class="file-list" id="file-list"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeFileBrowser()">Cancel</button>
                <button class="btn btn-primary" onclick="selectCurrentDirectory()">Select This Directory</button>
            </div>
        </div>
    </div>
</body>
</html>
