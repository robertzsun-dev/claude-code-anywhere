<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code Remote Access</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            background: #2d2d30;
            padding: 1rem;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header h1 {
            font-size: 1.2rem;
            font-weight: 500;
        }

        #session-info {
            font-size: 0.9rem;
            color: #858585;
        }

        #main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #sidebar {
            width: 300px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: margin-left 0.3s ease, width 0.3s ease;
        }

        #sidebar.hidden {
            margin-left: -300px;
            width: 0;
            border-right: none;
        }

        #sidebar h2 {
            padding: 1rem;
            font-size: 1rem;
            font-weight: 500;
            border-bottom: 1px solid #3e3e42;
        }

        .session-item {
            padding: 1rem;
            border-bottom: 1px solid #3e3e42;
            cursor: pointer;
            transition: background 0.2s;
        }

        .session-item:hover {
            background: #2a2d2e;
        }

        .session-item.active {
            background: #094771;
        }

        .session-id {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            color: #4ec9b0;
            margin-bottom: 0.5rem;
        }

        .session-meta {
            font-size: 0.8rem;
            color: #858585;
        }

        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #terminal-container {
            flex: 1;
            padding: 1rem;
            background: #000;
            display: none;
        }

        #terminal-container.active {
            display: block;
        }

        #input-area {
            padding: 1rem;
            background: #2d2d30;
            border-top: 1px solid #3e3e42;
            display: none;
            gap: 0.5rem;
        }

        #input-area.active {
            display: flex;
        }

        #input-box {
            flex: 1;
            padding: 0.5rem;
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
        }

        #input-box:focus {
            outline: none;
            border-color: #007acc;
        }

        button {
            padding: 0.5rem 1rem;
            background: #0e639c;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button:disabled {
            background: #3e3e42;
            cursor: not-allowed;
        }

        #status-bar {
            background: #007acc;
            color: white;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-dot.connected {
            background: #4ec9b0;
        }

        .status-dot.disconnected {
            background: #f48771;
        }

        #no-session {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100%;
            color: #858585;
        }

        #no-session h2 {
            margin-bottom: 1rem;
        }

        .hidden {
            display: none !important;
        }

        #loading {
            text-align: center;
            padding: 2rem;
            color: #858585;
        }

        #terminal {
            height: 100%;
            width: 100%;
        }

        .keyboard-hints {
            font-size: 0.75rem;
            color: #858585;
            padding: 0.5rem;
            text-align: center;
            background: #2d2d30;
            border-top: 1px solid #3e3e42;
        }

        #sidebar-toggle {
            background: transparent;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            border-radius: 3px;
        }

        #sidebar-toggle:hover {
            background: #3e3e42;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="header-left">
            <button id="sidebar-toggle" title="Toggle Sidebar (Ctrl+B)">☰</button>
            <h1>Claude Code Remote Access</h1>
        </div>
        <div id="session-info"></div>
    </div>

    <div id="main">
        <div id="sidebar">
            <h2>Active Sessions</h2>
            <div id="loading">Loading sessions...</div>
            <div id="session-list"></div>
        </div>

        <div id="content">
            <div id="no-session">
                <h2>No Session Selected</h2>
                <p>Select a session from the sidebar to view</p>
            </div>

            <div id="terminal-container">
                <div id="terminal"></div>
            </div>

            <div class="keyboard-hints">
                Press Ctrl+Shift+V to paste | Ctrl+B to toggle sidebar | Terminal captures input automatically
            </div>

            <div id="input-area">
                <input type="text" id="input-box" placeholder="Type input and press Enter to send...">
                <button id="send-btn">Send (Enter)</button>
                <button id="clear-btn">Clear</button>
            </div>
        </div>
    </div>

    <div id="status-bar">
        <div>
            <span class="status-dot disconnected" id="status-dot"></span>
            <span id="status-text">Disconnected</span>
        </div>
        <div id="session-stats"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
    <script>
        let currentSession = null;
        let ws = null;
        let sessions = [];
        let term = null;
        let fitAddon = null;

        // DOM elements
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sessionList = document.getElementById('session-list');
        const loading = document.getElementById('loading');
        const noSession = document.getElementById('no-session');
        const terminalContainer = document.getElementById('terminal-container');
        const inputArea = document.getElementById('input-area');
        const inputBox = document.getElementById('input-box');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const sessionInfo = document.getElementById('session-info');
        const sessionStats = document.getElementById('session-stats');

        // Sidebar toggle
        function toggleSidebar() {
            sidebar.classList.toggle('hidden');
            // Resize terminal display when sidebar toggles
            setTimeout(() => {
                if (term && fitAddon) {
                    fitAddon.fit();
                    // Note: Not sending resize to avoid PTY size conflicts
                }
            }, 350); // Wait for animation to complete
        }

        sidebarToggle.addEventListener('click', toggleSidebar);

        // Keyboard shortcut for sidebar toggle (Ctrl+B)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'b') {
                e.preventDefault();
                toggleSidebar();
            }
        });

        // Initialize xterm.js
        function initTerminal() {
            if (term) {
                term.dispose();
            }

            term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Monaco, Courier New, monospace',
                theme: {
                    background: '#000000',
                    foreground: '#ffffff',
                    cursor: '#ffffff',
                    cursorAccent: '#000000',
                    selection: 'rgba(255, 255, 255, 0.3)',
                    black: '#000000',
                    red: '#cd3131',
                    green: '#0dbc79',
                    yellow: '#e5e510',
                    blue: '#2472c8',
                    magenta: '#bc3fbc',
                    cyan: '#11a8cd',
                    white: '#e5e5e5',
                    brightBlack: '#666666',
                    brightRed: '#f14c4c',
                    brightGreen: '#23d18b',
                    brightYellow: '#f5f543',
                    brightBlue: '#3b8eea',
                    brightMagenta: '#d670d6',
                    brightCyan: '#29b8db',
                    brightWhite: '#e5e5e5'
                },
                scrollback: 10000,
                convertEol: true
            });

            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.loadAddon(new WebLinksAddon.WebLinksAddon());

            term.open(document.getElementById('terminal'));
            fitAddon.fit();

            // Handle terminal input
            term.onData((data) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'input',
                        data: data
                    }));
                }
            });

            // Handle resize - fit terminal to window but don't send to server
            // The PTY size is locked to the local terminal to prevent conflicts
            window.addEventListener('resize', () => {
                if (fitAddon) {
                    fitAddon.fit();
                    // Note: Not sending resize to server to prevent PTY size conflicts
                }
            });
        }

        // Send terminal size to server
        function sendTerminalSize() {
            if (ws && ws.readyState === WebSocket.OPEN && term) {
                ws.send(JSON.stringify({
                    type: 'resize',
                    cols: term.cols,
                    rows: term.rows
                }));
            }
        }

        // Load sessions
        async function loadSessions() {
            try {
                const response = await fetch('/sessions');
                const data = await response.json();
                sessions = data.sessions;
                renderSessions();
            } catch (error) {
                console.error('Error loading sessions:', error);
                sessionList.innerHTML = '<div style="padding: 1rem; color: #f48771;">Error loading sessions</div>';
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Render session list
        function renderSessions() {
            if (sessions.length === 0) {
                sessionList.innerHTML = '<div style="padding: 1rem; color: #858585;">No active sessions</div>';
                return;
            }

            sessionList.innerHTML = sessions.map(session => {
                const age = Math.floor((Date.now() - new Date(session.created).getTime()) / 1000);
                const ageStr = age < 60 ? `${age}s` : `${Math.floor(age / 60)}m`;

                return `
                    <div class="session-item" data-session-id="${session.id}">
                        <div class="session-id">${session.id}</div>
                        <div class="session-meta">
                            ${session.metadata.hostname || 'Unknown host'}<br>
                            ${session.metadata.cwd || '~'}<br>
                            Created ${ageStr} ago
                        </div>
                    </div>
                `;
            }).join('');

            // Add click handlers
            document.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sessionId = item.dataset.sessionId;
                    connectToSession(sessionId);
                });
            });
        }

        // Connect to session
        function connectToSession(sessionId) {
            // Close existing connection
            if (ws) {
                ws.close();
            }

            currentSession = sessionId;

            // Update UI
            document.querySelectorAll('.session-item').forEach(item => {
                item.classList.toggle('active', item.dataset.sessionId === sessionId);
            });

            noSession.classList.add('hidden');
            terminalContainer.classList.add('active');
            inputArea.classList.add('active');

            // Initialize terminal
            initTerminal();

            // Connect WebSocket
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}?role=viewer&session=${sessionId}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';
                updateSessionInfo();

                // Note: Not sending terminal size - PTY is locked to local terminal size
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };

            ws.onclose = () => {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected';
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                term.write('\r\n\x1b[31m[Error: Connection failed]\x1b[0m\r\n');
            };
        }

        // Handle WebSocket message
        function handleMessage(message) {
            switch (message.type) {
                case 'session-attached':
                    // Display history
                    if (message.history && message.history.length > 0) {
                        message.history.forEach(item => {
                            if (item.type === 'output') {
                                term.write(item.data);
                            }
                        });
                    }
                    updateSessionInfo(message.metadata);
                    break;

                case 'output':
                    term.write(message.data);
                    break;

                case 'metadata':
                    updateSessionInfo(message.data);
                    break;

                case 'exit':
                    term.write(`\r\n\x1b[31m[Session ended with code ${message.code}]\x1b[0m\r\n`);
                    break;

                case 'wrapper-disconnected':
                    term.write('\r\n\x1b[33m[Wrapper disconnected - waiting for reconnection...]\x1b[0m\r\n');
                    break;

                case 'error':
                    term.write(`\r\n\x1b[31m[Error: ${message.error}]\x1b[0m\r\n`);
                    break;
            }
        }

        // Update session info
        function updateSessionInfo(metadata = null) {
            const session = sessions.find(s => s.id === currentSession);
            if (!session) return;

            const meta = metadata || session.metadata;

            sessionInfo.innerHTML = `
                Session: <strong>${currentSession.substring(0, 8)}...</strong> |
                ${meta.hostname || 'Unknown'} |
                ${meta.cwd || '~'}
            `;

            sessionStats.textContent = `${meta.user || 'unknown'}@${meta.hostname || 'unknown'}`;
        }

        // Send input from input box
        function sendInput() {
            const input = inputBox.value;
            if (!input || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            ws.send(JSON.stringify({
                type: 'input',
                data: input + '\r'
            }));

            inputBox.value = '';
            term.focus();
        }

        // Clear terminal
        function clearTerminal() {
            if (term) {
                term.clear();
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', sendInput);
        clearBtn.addEventListener('click', clearTerminal);

        inputBox.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendInput();
            }
        });

        // Auto-refresh session list
        setInterval(loadSessions, 10000); // Refresh every 10 seconds

        // Initial load
        loadSessions();
    </script>
</body>
</html>
