<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code Remote Access</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
            background: #000000;
            color: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0 1.5rem;
            height: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        #header h1 {
            font-size: 0.875rem;
            font-weight: 600;
            color: #fafafa;
            letter-spacing: -0.01em;
        }

        #session-info {
            font-size: 0.8125rem;
            color: #a1a1aa;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }

        #main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #sidebar {
            width: 280px;
            background: #000000;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: margin-left 0.2s cubic-bezier(0.16, 1, 0.3, 1), width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #sidebar.hidden {
            margin-left: -280px;
            width: 0;
            border-right: none;
        }

        #sidebar h2 {
            padding: 1rem 1.25rem;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #71717a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: #000000;
        }

        .session-item {
            padding: 0.875rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: background 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            background: transparent;
        }

        .session-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #fafafa;
            opacity: 0;
            transition: opacity 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .session-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .session-item.active {
            background: rgba(255, 255, 255, 0.06);
        }

        .session-item.active::before {
            opacity: 1;
        }

        .session-id {
            font-family: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Menlo', monospace;
            font-size: 0.8125rem;
            color: #fafafa;
            margin-bottom: 0.375rem;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .session-meta {
            font-size: 0.75rem;
            color: #71717a;
            line-height: 1.5;
        }

        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #terminal-container {
            flex: 1;
            padding: 1rem;
            background: #000000;
            display: none;
            overflow: auto;
            position: relative;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y;
        }

        #terminal {
            /* Let xterm.js control dimensions based on cols/rows */
        }

        #terminal-container.active {
            display: block;
        }

        button {
            padding: 0.5rem 0.875rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fafafa;
            cursor: pointer;
            font-size: 0.8125rem;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }

        button:active {
            background: rgba(255, 255, 255, 0.04);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #status-bar {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fafafa;
            padding: 0 1.5rem;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            font-weight: 400;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        .status-dot.disconnected {
            background: #71717a;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        #no-session {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100%;
            color: #71717a;
        }

        #no-session h2 {
            margin-bottom: 0.5rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #fafafa;
            letter-spacing: -0.01em;
        }

        #no-session p {
            color: #71717a;
            font-size: 0.8125rem;
        }

        .hidden {
            display: none !important;
        }

        #loading {
            text-align: center;
            padding: 2rem;
            color: #71717a;
            font-size: 0.8125rem;
        }

        #terminal {
            height: 100%;
            width: 100%;
        }

        .keyboard-hints {
            font-size: 0.6875rem;
            color: #52525b;
            padding: 0.75rem 1.25rem;
            text-align: center;
            background: #000000;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        #sidebar-toggle {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fafafa;
            padding: 0.375rem 0.625rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 6px;
            line-height: 1;
        }

        #sidebar-toggle:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            #header {
                height: 44px;
                padding: 0 0.75rem;
            }

            #header h1 {
                font-size: 0.8125rem;
            }

            #session-info {
                display: none;
            }

            #sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 100;
                box-shadow: 2px 0 8px rgba(0, 0, 0, 0.3);
            }

            #sidebar.hidden {
                margin-left: -280px;
            }

            #sidebar-toggle {
                padding: 0.25rem 0.5rem;
                font-size: 0.875rem;
            }

            #terminal-container {
                padding: 0.5rem;
            }

            #status-bar {
                height: 32px;
                padding: 0 0.75rem;
                font-size: 0.6875rem;
            }
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="header-left">
            <button id="sidebar-toggle" title="Toggle Sidebar (Ctrl+B)">☰</button>
            <h1>Claude Code Remote Access</h1>
        </div>
        <div id="session-info"></div>
    </div>

    <div id="main">
        <div id="sidebar">
            <h2>Active Sessions</h2>
            <div id="loading">Loading sessions...</div>
            <div id="session-list"></div>
        </div>

        <div id="content">
            <div id="no-session">
                <h2>No Session Selected</h2>
                <p>Select a session from the sidebar to view</p>
            </div>

            <div id="terminal-container">
                <div id="terminal"></div>
            </div>

            <div class="keyboard-hints">
                Press Ctrl+Shift+V to paste | Ctrl+B to toggle sidebar | Type directly in terminal
            </div>
        </div>
    </div>

    <div id="status-bar">
        <div>
            <span class="status-dot disconnected" id="status-dot"></span>
            <span id="status-text">Disconnected</span>
        </div>
        <div id="session-stats"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
    <script>
        let currentSession = null;
        let ws = null;
        let sessions = [];
        let term = null;

        // DOM elements
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sessionList = document.getElementById('session-list');
        const loading = document.getElementById('loading');
        const noSession = document.getElementById('no-session');
        const terminalContainer = document.getElementById('terminal-container');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const sessionInfo = document.getElementById('session-info');
        const sessionStats = document.getElementById('session-stats');

        // Hide sidebar by default on mobile
        if (window.innerWidth <= 768) {
            sidebar.classList.add('hidden');
        }

        // Sidebar toggle
        function toggleSidebar() {
            sidebar.classList.toggle('hidden');
            // No resize needed - terminal maintains natural PTY size
        }

        sidebarToggle.addEventListener('click', toggleSidebar);

        // Keyboard shortcut for sidebar toggle (Ctrl+B)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'b') {
                e.preventDefault();
                toggleSidebar();
            }
        });

        // Initialize xterm.js with specific dimensions from PTY
        function initTerminal(cols, rows) {
            if (term) {
                term.dispose();
            }

            // Create terminal with exact PTY dimensions
            // This ensures proper character alignment and enables horizontal scrolling
            term = new Terminal({
                cols: cols || 80,
                rows: rows || 24,
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Monaco, Courier New, monospace',
                theme: {
                    background: '#000000',
                    foreground: '#ffffff',
                    cursor: '#ffffff',
                    cursorAccent: '#000000',
                    selection: 'rgba(255, 255, 255, 0.3)',
                    black: '#000000',
                    red: '#cd3131',
                    green: '#0dbc79',
                    yellow: '#e5e510',
                    blue: '#2472c8',
                    magenta: '#bc3fbc',
                    cyan: '#11a8cd',
                    white: '#e5e5e5',
                    brightBlack: '#666666',
                    brightRed: '#f14c4c',
                    brightGreen: '#23d18b',
                    brightYellow: '#f5f543',
                    brightBlue: '#3b8eea',
                    brightMagenta: '#d670d6',
                    brightCyan: '#29b8db',
                    brightWhite: '#e5e5e5'
                },
                scrollback: 10000,
                convertEol: true,
                scrollOnUserInput: true
            });

            term.loadAddon(new WebLinksAddon.WebLinksAddon());
            term.open(document.getElementById('terminal'));

            // Handle terminal input
            term.onData((data) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'input',
                        data: data
                    }));
                }
            });
        }

        // Send terminal size to server
        function sendTerminalSize() {
            if (ws && ws.readyState === WebSocket.OPEN && term) {
                ws.send(JSON.stringify({
                    type: 'resize',
                    cols: term.cols,
                    rows: term.rows
                }));
            }
        }

        // Load sessions
        async function loadSessions() {
            try {
                const response = await fetch('/sessions');
                const data = await response.json();
                sessions = data.sessions;
                renderSessions();
            } catch (error) {
                console.error('Error loading sessions:', error);
                sessionList.innerHTML = '<div style="padding: 1rem; color: #f48771;">Error loading sessions</div>';
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Render session list
        function renderSessions() {
            if (sessions.length === 0) {
                sessionList.innerHTML = '<div style="padding: 1rem; color: #858585;">No active sessions</div>';
                return;
            }

            sessionList.innerHTML = sessions.map(session => {
                const age = Math.floor((Date.now() - new Date(session.created).getTime()) / 1000);
                const ageStr = age < 60 ? `${age}s` : `${Math.floor(age / 60)}m`;

                return `
                    <div class="session-item" data-session-id="${session.id}">
                        <div class="session-id">${session.id}</div>
                        <div class="session-meta">
                            ${session.metadata.hostname || 'Unknown host'}<br>
                            ${session.metadata.cwd || '~'}<br>
                            Created ${ageStr} ago
                        </div>
                    </div>
                `;
            }).join('');

            // Add click handlers
            document.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sessionId = item.dataset.sessionId;
                    connectToSession(sessionId);
                });
            });
        }

        // Connect to session
        function connectToSession(sessionId) {
            // Close existing connection
            if (ws) {
                ws.close();
            }

            currentSession = sessionId;

            // Update UI
            document.querySelectorAll('.session-item').forEach(item => {
                item.classList.toggle('active', item.dataset.sessionId === sessionId);
            });

            noSession.classList.add('hidden');
            terminalContainer.classList.add('active');

            // Don't initialize terminal yet - wait for session-attached with PTY dimensions

            // Connect WebSocket
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}?role=viewer&session=${sessionId}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';
                updateSessionInfo();

                // Note: Not sending terminal size - PTY is locked to local terminal size
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };

            ws.onclose = () => {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected';
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                term.write('\r\n\x1b[31m[Error: Connection failed]\x1b[0m\r\n');
            };
        }

        // Handle WebSocket message
        function handleMessage(message) {
            switch (message.type) {
                case 'session-attached':
                    // Initialize terminal with PTY dimensions
                    if (message.metadata && message.metadata.cols && message.metadata.rows) {
                        initTerminal(message.metadata.cols, message.metadata.rows);
                    } else {
                        // Fallback to default dimensions if not provided
                        initTerminal(80, 24);
                    }

                    // Display history
                    if (message.history && message.history.length > 0) {
                        message.history.forEach(item => {
                            if (item.type === 'output') {
                                term.write(item.data);
                            }
                        });
                    }
                    updateSessionInfo(message.metadata);
                    break;

                case 'output':
                    if (term) {
                        term.write(message.data);
                    }
                    break;

                case 'metadata':
                    // Reinitialize terminal if dimensions changed
                    if (message.data && message.data.cols && message.data.rows && term) {
                        const currentCols = term.cols;
                        const currentRows = term.rows;
                        if (currentCols !== message.data.cols || currentRows !== message.data.rows) {
                            initTerminal(message.data.cols, message.data.rows);
                        }
                    }
                    updateSessionInfo(message.data);
                    break;

                case 'exit':
                    if (term) {
                        term.write(`\r\n\x1b[31m[Session ended with code ${message.code}]\x1b[0m\r\n`);
                    }
                    break;

                case 'wrapper-disconnected':
                    if (term) {
                        term.write('\r\n\x1b[33m[Wrapper disconnected - waiting for reconnection...]\x1b[0m\r\n');
                    }
                    break;

                case 'error':
                    if (term) {
                        term.write(`\r\n\x1b[31m[Error: ${message.error}]\x1b[0m\r\n`);
                    }
                    break;
            }
        }

        // Update session info
        function updateSessionInfo(metadata = null) {
            const session = sessions.find(s => s.id === currentSession);
            if (!session) return;

            const meta = metadata || session.metadata;

            sessionInfo.innerHTML = `
                Session: <strong>${currentSession.substring(0, 8)}...</strong> |
                ${meta.hostname || 'Unknown'} |
                ${meta.cwd || '~'}
            `;

            sessionStats.textContent = `${meta.user || 'unknown'}@${meta.hostname || 'unknown'}`;
        }

        // Terminal input is handled directly by xterm.js
        // No need for separate input box

        // Auto-refresh session list
        setInterval(loadSessions, 10000); // Refresh every 10 seconds

        // Initial load
        loadSessions();
    </script>
</body>
</html>
