version: '3.8'

services:
  # Claude Code Remote Access Server
  server:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    container_name: claude-remote-server
    ports:
      - "8765:8765"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8765
    volumes:
      - server-logs:/var/log/claude-remote
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - claude-network

  # Nginx reverse proxy (optional, for TLS)
  nginx:
    image: nginx:alpine
    container_name: claude-remote-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - claude-network

volumes:
  server-logs:

networks:
  claude-network:
    driver: bridge
